<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title></head><body><div id="app"></div><script>
"use strict";
function mount(event) {
  if (event.source !== window.parent || event.origin !== location.origin || event.data?.type !== "streamlit:render") return;
  const assets = event.data.args?.assets;
  if (!assets) return;
  window.removeEventListener("message", mount);
  window.STREAMLIT_COMPONENT = true;
  const style = document.createElement("style");
  style.textContent = assets.css;
  document.head.append(style);
  for (const [key, value] of Object.entries(assets.images)) {
    if (/^[A-Z][A-Z0-9_]*_IMAGE$/.test(key)) window[key] = value;
  }
  for (const source of assets.scripts) {
    const script = document.createElement("script");
    script.textContent = source;
    document.body.append(script);
  }
  window.dispatchEvent(new MessageEvent("message", {source: event.source, origin: event.origin, data: event.data}));
}
window.addEventListener("message", mount);
window.parent.postMessage({isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1}, location.origin);
</script></body></html>
